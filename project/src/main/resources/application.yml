spring:
  application:
    name: securechat

  # Default profile — override with SPRING_PROFILES_ACTIVE=prod in production
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securechat}
    username: ${DB_USERNAME:securechat}
    password: ${DB_PASSWORD:securechat}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate must never mutate it
    open-in-view: false           # avoid lazy-loading over an open session in the web layer
    show-sql: false               # NEVER true in prod — leaks query structure
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis holds rate-limit + account-lockout state; it must require auth in every environment.
      # docker-compose sets this same default; override REDIS_PASSWORD in production.
      password: ${REDIS_PASSWORD:securechat-redis-dev}
      timeout: 2000ms

server:
  port: 8080
  error:
    include-stacktrace: never     # never expose stack traces to clients
    include-message: never
    include-binding-errors: never

app:
  jwt:
    # RSA key pair in PEM form, supplied via environment variables.
    # RS256 (asymmetric) is mandatory — see SecurityConfig / JwtTokenProvider.
    # In the dev profile these may be left blank; an ephemeral key pair is then
    # generated at startup (dev convenience only — NEVER rely on this in prod).
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    issuer: securechat
    access-expiration-ms: 900000       # 15 minutes — short-lived access token
    refresh-expiration-ms: 604800000   # 7 days — refresh token

  # Redis-backed rate limits (Bucket4j). capacity = burst; refill-tokens over
  # refill-duration-seconds = sustained rate. Buckets are keyed per user (or per
  # IP for the unauthenticated login/register endpoints).
  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 900       # 5 attempts per 15 minutes, per IP
    register:
      capacity: 3
      refill-tokens: 3
      refill-duration-seconds: 3600      # 3 per hour, per IP
    message-send:
      capacity: 60
      refill-tokens: 60
      refill-duration-seconds: 60        # 60 messages per minute, per user
    pre-key-fetch:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 3600      # 10 pre-key bundle fetches per hour, per user
    user-search:
      capacity: 30
      refill-tokens: 30
      refill-duration-seconds: 60        # 30 user searches per minute, per user

  security:
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 30
    allowed-origins:
      - http://localhost:4200            # Angular dev server
    # Socket IPs of reverse proxies allowed to set X-Forwarded-For. Empty = never trust the header
    # (use the real socket address), so clients can't spoof their IP to dodge per-IP rate limits.
    # Set to your load balancer / ingress IPs in production.
    trusted-proxies: []
    disappearing-message-cleanup-cron: "0 */5 * * * *"   # every 5 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never              # hide internals from public probes
