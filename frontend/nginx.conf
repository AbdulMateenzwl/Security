# nginx serves the Angular SPA and reverse-proxies the backend, so the browser
# only ever talks to a single origin (no CORS, and the API/WS are not exposed
# directly to the outside world — only Caddy is published).

# TLS is terminated one hop up at Caddy, which reaches nginx over plain HTTP but
# forwards the original scheme in X-Forwarded-Proto. Honour it when present so the
# backend sees "https"; fall back to nginx's own scheme for direct/local access.
# (conf.d/*.conf is included inside http{}, so a map is valid here.)
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Scoped to the static/HTML locations (not /api or /ws) so proxied
    # backend responses keep their own headers and we don't emit duplicates. NOTE: nginx does not
    # merge add_header across levels — a location that sets any add_header drops inherited ones — so
    # the full set is repeated in each SPA-serving location below.
    #
    # The CSP is deliberately strict: same-origin only, no framing (clickjacking), locked base-uri.
    # 'unsafe-inline' is allowed for styles only (Angular injects component <style> tags at runtime),
    # and 'wasm-unsafe-eval' for scripts so the client-side Signal crypto can run — neither permits
    # arbitrary inline/eval'd script. Verify the app + encryption still work after changing this.
    #
    # Reusable set (keep the two copies identical):
    #   Content-Security-Policy, X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
    #   Permissions-Policy, Strict-Transport-Security.

    # Never cache the shell; hashed assets are immutable and cached hard.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # REST API -> backend. proxy_pass without a URI preserves the full /api/... path.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket/STOMP handshake (/ws) -> backend, with upgrade headers. The access token travels in
    # the STOMP CONNECT frame, not the URL, so it never appears in this access log.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # SPA history fallback — every other path serves index.html. Same security header set as above.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
