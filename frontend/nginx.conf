# nginx serves the Angular SPA and reverse-proxies the backend, so the browser
# only ever talks to a single origin (no CORS, and the API/WS are not exposed
# directly to the outside world — only Caddy is published).

# TLS is terminated one hop up at Caddy, which reaches nginx over plain HTTP but
# forwards the original scheme in X-Forwarded-Proto. Honour it when present so the
# backend sees "https"; fall back to nginx's own scheme for direct/local access.
# (conf.d/*.conf is included inside http{}, so a map is valid here.)
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; hashed assets are immutable and cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # REST API -> backend. proxy_pass without a URI preserves the full /api/... path.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket/STOMP handshake (/ws?token=...) -> backend, with upgrade headers.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # SPA history fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
