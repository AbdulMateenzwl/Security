# Full-stack SecureChat deployment: Caddy (HTTPS) + nginx-hosted frontend +
# Spring Boot backend + PostgreSQL + Redis, all containerized.
#
#   ./scripts/gen-secrets.sh 20-1-2-3.sslip.io   # once — writes .env (secrets, JWT keys, domain)
#   docker compose up -d --build                 # build images and start the whole stack
#   docker compose ps                            # check health
#   open https://20-1-2-3.sslip.io               # the app, over HTTPS
#
# Only Caddy is published to the host (ports 80/443). It terminates TLS with an
# automatically-issued Let's Encrypt certificate for the sslip.io hostname and
# reverse-proxies to nginx. The frontend, backend, database and Redis are
# reachable only on the internal Docker network.
#
# NOTE: the backend defaults to the `prod` profile, which refuses to start with
# default/blank secrets (ProdSecretsValidator). Run gen-secrets.sh first, or set
# SPRING_PROFILES_ACTIVE=dev in .env for a relaxed local run.

name: securechat

services:
  postgres:
    image: postgres:16
    container_name: securechat-postgres
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (run ./scripts/gen-secrets.sh)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: securechat-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (run ./scripts/gen-secrets.sh)}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./project
    container_name: securechat-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/securechat
      DB_USERNAME: securechat
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: securechat-frontend
    depends_on:
      backend:
        condition: service_started
    # Not published to the host — only Caddy talks to it, over the internal network.
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: securechat-caddy
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. 20-1-2-3.sslip.io  (your VM's public IP with dots or dashes)
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env, e.g. 20-1-2-3.sslip.io (run ./scripts/gen-secrets.sh <ip>)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # issued certs + ACME account — persist across restarts
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
