# Full-stack SecureChat deployment: nginx-hosted frontend + Spring Boot backend +
# PostgreSQL + Redis, all containerized.
#
#   ./scripts/gen-secrets.sh     # once — writes .env with strong secrets + JWT keys
#   docker compose up -d --build # build images and start the whole stack
#   docker compose ps            # check health
#   open http://localhost         # the app (nginx) — the only published port
#
# Only the frontend (nginx) is published to the host. The backend, database and
# Redis are reachable only on the internal Docker network.
#
# NOTE: the backend defaults to the `prod` profile, which refuses to start with
# default/blank secrets (ProdSecretsValidator). Run gen-secrets.sh first, or set
# SPRING_PROFILES_ACTIVE=dev in .env for a relaxed local run.

name: securechat

services:
  postgres:
    image: postgres:16
    container_name: securechat-postgres
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (run ./scripts/gen-secrets.sh)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: securechat-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (run ./scripts/gen-secrets.sh)}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./project
    container_name: securechat-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/securechat
      DB_USERNAME: securechat
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: securechat-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
